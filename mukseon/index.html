// ---------- 낙관첩: collectible seal stamps (achievements), scroll-unroll intro ----------
const SEALS = [
  { id: 'first', han: '初線', name: '첫 먹줄', how: '매듭에 처음 먹줄을 겁니다' },
  { id: 'bamboo', han: '竹林', name: '대숲에 들다', how: '250 m에 오릅니다' },
  { id: 'falls', han: '瀑布', name: '폭포를 지나', how: '700 m에 오릅니다' },
  { id: 'moon', han: '明月', name: '달을 보다', how: '1,300 m에 오릅니다' },
  { id: 'storm', han: '雷雨', name: '번개 속으로', how: '2,000 m에 오릅니다' },
  { id: 'clouds', han: '雲上', name: '구름 위에 서다', how: '3,000 m에 오릅니다' },
  { id: 'master', han: '名筆', name: '명필', how: '명필 판정을 받습니다' },
  { id: 'onestroke', han: '一筆', name: '일필휘지', how: '일필휘지 판정을 받습니다' },
  { id: 'five', han: '五連', name: '다섯 획', how: '명필 이상을 5번 연속으로 냅니다' },
  { id: 'plum', han: '百梅', name: '매화 백 송이', how: '한 번에 매화 100송이를 모읍니다' },
  { id: 'talisman', han: '符籍', name: '부적 다루기', how: '붉은 매듭을 끊기 전에 20번 놓습니다' },
  { id: 'daily', han: '今日', name: '오늘의 족자', how: '오늘의 족자를 한 번 오릅니다' },
];
const Seals = {
  got: new Set(store.get('seals', [])),
  unlock(id) {
    if (!G || G.demo || this.got.has(id)) return;
    this.got.add(id); store.set('seals', [...this.got]);
    const s = SEALS.find(x => x.id === id);
    G.newSeals.push(s.name);
    const p = G.player;
    FX.word(p.x, p.y - 52, '낙관 · ' + s.name, true, true);
    SFX.power();
  },
  check() {
    const m = G.maxH;
    if (G.grabs >= 1) this.unlock('first');
    if (m >= 250) this.unlock('bamboo');
    if (m >= 700) this.unlock('falls');
    if (m >= 1300) this.unlock('moon');
    if (m >= 2000) this.unlock('storm');
    if (m >= 3000) this.unlock('clouds');
    if (G.blossoms >= 100) this.unlock('plum');
    if (G.combo >= 5) this.unlock('five');
    if (G.fragileSafe >= 20) this.unlock('talisman');
  },
};

// carved seal (白文印: the characters are cut away so paper shows through)
function drawSeal(cnv, s, owned) {
  const c = cnv.getContext('2d'), S = cnv.width;
  c.clearRect(0, 0, S, S);
  const r = mulberry32(hashStr(s.id));
  c.save(); c.translate(S / 2, S / 2); c.rotate((r() - 0.5) * 0.12);
  const w = S * 0.8;
  if (owned) {
    c.fillStyle = '#b3261e';
    c.beginPath(); c.roundRect ? c.roundRect(-w / 2, -w / 2, w, w, S * 0.06) : c.rect(-w / 2, -w / 2, w, w); c.fill();
    c.globalCompositeOperation = 'destination-out';
    c.fillStyle = '#000'; c.font = `700 ${S * 0.3}px "Gowun Batang", serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
    // two characters stacked right-to-left like a real seal: here side by side vertically
    c.fillText(s.han[0], w * 0.2, -w * 0.18); c.fillText(s.han[1], w * 0.2, w * 0.2);
    c.font = `700 ${S * 0.16}px "Gowun Batang", serif`;
    c.fillText('印', -w * 0.22, 0);
    // worn edges: small chips knocked out of the stone
    for (let i = 0; i < 26; i++) { const a = r() * TAU, rr = w * (0.36 + r() * 0.18); c.beginPath(); c.arc(Math.cos(a) * rr, Math.sin(a) * rr, r() * S * 0.025 + 0.5, 0, TAU); c.fill(); }
    c.fillRect(-w * 0.04, -w * 0.4, w * 0.012, w * 0.8);
    c.globalCompositeOperation = 'source-over';
  } else {
    c.strokeStyle = 'rgba(27,26,23,.35)'; c.lineWidth = 1.5; c.setLineDash([4, 4]);
    c.strokeRect(-w / 2, -w / 2, w, w); c.setLineDash([]);
    c.fillStyle = 'rgba(27,26,23,.25)'; c.font = `700 ${S * 0.3}px "Gowun Batang", serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText('?', 0, 0);
  }
  c.restore();
}

function openSeals() {
  const grid = $('sealGrid'); grid.innerHTML = '';
  for (const s of SEALS) {
    const own = Seals.got.has(s.id);
    const d = document.createElement('div'); d.className = 'seal' + (own ? '' : ' locked');
    const cnv = document.createElement('canvas'); cnv.width = cnv.height = 120;
    d.appendChild(cnv);
    const t = document.createElement('div'); t.innerHTML = `<b>${s.name}</b><span>${s.how}</span>`;
    d.appendChild(t); grid.appendChild(d);
    drawSeal(cnv, s, own);
  }
  $('sealCount').textContent = `${Seals.got.size} / ${SEALS.length}`;
  showScreen('scrSeals');
}

// a wooden roller sweeps up as the scroll opens
function drawUnroll(c) {
  const k = clamp(G.t / 0.9, 0, 1);
  if (k >= 1 || G.demo) return;
  const e = 1 - Math.pow(1 - k, 3);
  const sw = W * V.scale, edge = V.h * (1 - e);
  c.setTransform(V.dpr, 0, 0, V.dpr, 0, 0);
  c.fillStyle = '#2a2622'; c.fillRect(V.ox - 6, 0, sw + 12, edge);
  const g = c.createLinearGradient(0, edge - 10, 0, edge + 14);
  g.addColorStop(0, '#3d2a1c'); g.addColorStop(0.45, '#8a6440'); g.addColorStop(1, '#2e1f14');
  c.fillStyle = g; c.fillRect(V.ox - 14, edge - 10, sw + 28, 24);
  c.fillStyle = '#b8913e'; c.fillRect(V.ox - 22, edge - 7, 10, 18); c.fillRect(V.ox + sw + 12, edge - 7, 10, 18);
}

// ==== 07_fx.js ====
// ---------- particles, brush words, weather ----------
const FX = {
  ps: [], words: [], shakeAmt: 0, shakeOn: store.get('shake', true), weather: [],
  init() { this.ps.length = 0; this.words.length = 0; this.shakeAmt = 0; this.weather.length = 0; },
  add(o) { if (this.ps.length > 420) this.ps.shift(); this.ps.push(o); return o; },
  inkBurst(x, y, n, s = 1, red = false) {
    for (let i = 0; i < n; i++) {
      const a = rand(TAU), v = rand(60, 260) * s;
      this.add({ k: 'drop', x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, r: rand(1.5, 4.5) * s, life: rand(0.5, 1.0), max: 1, red, g: 700 });
    }
    this.add({ k: 'splat', x, y, r: 10 * s + rand(4), life: 0.9, max: 0.9, red, rot: rand(TAU) });
  },
  ring(x, y, r0, r1, life, gold = false) { this.add({ k: 'ring', x, y, r0, r1, life, max: life, gold }); },
  petals(x, y, n) { for (let i = 0; i < n; i++) this.add({ k: 'petal', x, y, vx: rand(-80, 80), vy: rand(-120, -20), r: rand(2.5, 4), life: rand(0.8, 1.4), max: 1.4, rot: rand(TAU), vr: rand(-8, 8), g: 120 }); },
  feathers(x, y) { for (let i = 0; i < 4; i++) this.add({ k: 'feather', x, y, vx: rand(-60, 60), vy: rand(20, 80), r: 6, life: 1.4, max: 1.4, rot: rand(TAU), vr: rand(-4, 4), g: 40 }); },
  dust(x, y) { this.add({ k: 'drop', x: x + rand(-6, 6), y: y + rand(0, 10), vx: rand(-20, 20), vy: rand(0, 40), r: rand(0.8, 1.6), life: 0.6, max: 0.6, g: 400, gold: true }); },
  word(x, y, s, big = false, red = false) { this.words.push({ x, y, s, big, red, t: 0 }); if (this.words.length > 8) this.words.shift(); },
  shake(a) { if (this.shakeOn) this.shakeAmt = Math.max(this.shakeAmt, a); },
  update(dt) {
    for (let i = this.ps.length - 1; i >= 0; i--) {
      const p = this.ps[i]; p.life -= dt;
      if (p.life <= 0) { this.ps.splice(i, 1); continue; }
      if (p.vx !== undefined) { p.vy += (p.g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.exp(-1.5 * dt); }
      if (p.vr) p.rot += p.vr * dt;
    }
    for (let i = this.words.length - 1; i >= 0; i--) { const w = this.words[i]; w.t += dt; w.y -= 22 * dt; if (w.t > 1.1) this.words.splice(i, 1); }
    this.shakeAmt = Math.max(0, this.shakeAmt - 40 * dt);
    V.shakeX = this.shakeAmt ? rand(-1, 1) * this.shakeAmt : 0; V.shakeY = this.shakeAmt ? rand(-1, 1) * this.shakeAmt : 0;
  },
  draw(c, pal) {
    const inkCol = pal.night > 0.5 ? '#0b0a09' : rgba(pal.ink);
    for (const p of this.ps) {
      const k = clamp(p.life / p.max, 0, 1);
      if (p.k === 'drop') { c.globalAlpha = Math.min(1, k * 1.5); c.fillStyle = p.gold ? '#b8913e' : p.red ? '#b3261e' : inkCol; c.beginPath(); c.arc(p.x, p.y, p.r, 0, TAU); c.fill(); }
      else if (p.k === 'splat') { splat(c, p.x, p.y, p.r * (1.4 - k * 0.4), k * 0.55, p.red, p.rot); }
      else if (p.k === 'ring') { c.globalAlpha = k; c.strokeStyle = p.gold ? '#b8913e' : inkCol; c.lineWidth = 2 * k + 0.5; c.beginPath(); c.arc(p.x, p.y, lerp(p.r1, p.r0, k), 0, TAU); c.stroke(); }
      else if (p.k === 'petal') { c.globalAlpha = Math.min(1, k * 2); c.fillStyle = '#e8a3b0'; c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.beginPath(); c.ellipse(0, 0, p.r, p.r * 0.55, 0, 0, TAU); c.fill(); c.restore(); }
      else if (p.k === 'feather') { c.globalAlpha = k; c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillStyle = '#f7f4ec'; c.strokeStyle = '#1b1a17'; c.lineWidth = 0.8; c.beginPath(); c.ellipse(0, 0, 2.5, 7, 0, 0, TAU); c.fill(); c.stroke(); c.restore(); }
    }
    c.globalAlpha = 1;
  },
  drawWords(c, pal) {
    c.textAlign = 'center'; c.textBaseline = 'middle';
    for (const w of this.words) {
      const a = w.t < 0.1 ? w.t / 0.1 : clamp(1 - (w.t - 0.6) / 0.5, 0, 1);
      const sc = w.t < 0.12 ? 1.5 - w.t * 4 : 1;
      c.globalAlpha = a;
      c.font = `${(w.big ? 34 : 24) * sc}px "Nanum Brush Script", serif`;
      c.lineWidth = 4; c.strokeStyle = pal.night > 0.5 ? 'rgba(20,24,36,.85)' : 'rgba(239,231,212,.9)';
      c.strokeText(w.s, w.x, w.y);
      c.fillStyle = w.red ? '#b3261e' : (pal.night > 0.5 ? '#f1ecdf' : '#1b1a17');
      c.fillText(w.s, w.x, w.y);
    }
    c.globalAlpha = 1;
  },
  // screen-space weather tied to the biome
  updateWeather(dt, pal) {
    const b = pal.b, want = b.weather === 'rain' ? 90 : b.weather === 'mist' ? 8 : 34;
    while (this.weather.length < want) this.weather.push(this.spawnW(b.weather, true));
    if (this.weather.length > want) this.weather.length = want;
    for (let i = 0; i < this.weather.length; i++) {
      const w = this.weather[i];
      if (w.type !== b.weather) { this.weather[i] = this.spawnW(b.weather, false); continue; }
      w.x += w.vx * dt + (G.windX || 0) * dt * 0.3; w.y += w.vy * dt; w.rot += w.vr * dt; w.t += dt;
      if (w.y > 1.1 || w.y < -0.1 || w.x < -0.15 || w.x > 1.15) this.weather[i] = this.spawnW(b.weather, false);
    }
  },
  spawnW(type, anywhere) {
    const w = { type, x: rand(), y: anywhere ? rand() : -0.05, vx: 0, vy: 0, rot: rand(TAU), vr: rand(-2, 2), s: rand(0.6, 1.3), t: rand(10) };
    if (type === 'petal') { w.vx = rand(0.01, 0.05); w.vy = rand(0.04, 0.08); }
    else if (type === 'leaf') { w.vx = rand(-0.03, 0.06); w.vy = rand(0.05, 0.09); }
    else if (type === 'mist') { w.vx = rand(0.01, 0.03) * (Math.random() < 0.5 ? 1 : -1); w.vy = 0; w.y = rand(); w.x = anywhere ? rand() : (w.vx > 0 ? -0.1 : 1.1); }
    else if (type === 'firefly') { w.vx = rand(-0.02, 0.02); w.vy = rand(-0.03, 0.01); if (!anywhere) w.y = 1.05; }
    else if (type === 'rain') { w.vx = -0.25; w.vy = rand(1.4, 1.9); }
    else if (type === 'gold') { w.vx = rand(-0.01, 0.01); w.vy = rand(-0.05, -0.02); if (!anywhere) w.y = 1.05; }
    return w;
  },
  drawWeather(c, pal) {
    c.setTransform(V.dpr, 0, 0, V.dpr, 0, 0);
    const sw = W * V.scale, ox = V.ox, h = V.h;
    c.save(); c.beginPath(); c.rect(ox, 0, sw, h); c.clip();
    for (const w of this.weather) {
      const x = ox + w.x * sw, y = w.y * h;
      if (w.type === 'petal') { c.fillStyle = 'rgba(232,163,176,.85)'; c.save(); c.translate(x, y); c.rotate(w.rot); c.beginPath(); c.ellipse(0, 0, 3.4 * w.s, 2 * w.s, 0, 0, TAU); c.fill(); c.restore(); }
      else if (w.type === 'leaf') { c.fillStyle = rgba(pal.ink, 0.55); c.save(); c.translate(x, y); c.rotate(w.rot); c.beginPath(); c.moveTo(-7 * w.s, 0); c.quadraticCurveTo(0, -2.4 * w.s, 7 * w.s, 0); c.quadraticCurveTo(0, 2.4 * w.s, -7 * w.s, 0); c.fill(); c.restore(); }
      else if (w.type === 'mist') { const g = c.createRadialGradient(x, y, 0, x, y, 140 * w.s); g.addColorStop(0, 'rgba(250,250,246,.35)'); g.addColorStop(1, 'rgba(250,250,246,0)'); c.fillStyle = g; c.fillRect(x - 140 * w.s, y - 140 * w.s, 280 * w.s, 280 * w.s); }
      else if (w.type === 'firefly') { c.globalCompositeOperation = 'lighter'; glow(c, x, y, 8 * w.s, [200, 255, 150], 0.5 + 0.5 * Math.sin(w.t * 3)); c.globalCompositeOperation = 'source-over'; }
      else if (w.type === 'rain') { c.strokeStyle = 'rgba(200,205,215,.35)'; c.lineWidth = 1; c.beginPath(); c.moveTo(x, y); c.lineTo(x - 4, y + 16); c.stroke(); }
      else if (w.type === 'gold') { c.fillStyle = `rgba(184,145,62,${0.5 + 0.4 * Math.sin(w.t * 4)})`; c.fillRect(x, y, 2 * w.s, 2 * w.s); }
    }
    c.restore();
  },
};

// ---------- input: press-and-hold anywhere ----------
const Input = {
  ptrs: new Set(), keys: new Set(), get down() { return this.ptrs.size > 0 || this.keys.size > 0 || !!this.bot; }, bot: false,
};
cv.addEventListener('pointerdown', e => {
  if (!G || G.state !== 'play') return;
  e.preventDefault(); SFX.init();
  Input.ptrs.add(e.pointerId);
  try { cv.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
}, { passive: false });
const ptrUp = e => Input.ptrs.delete(e.pointerId);
cv.addEventListener('pointerup', ptrUp); cv.addEventListener('pointercancel', ptrUp); cv.addEventListener('lostpointercapture', ptrUp);
document.addEventListener('touchmove', e => { if (G && G.state === 'play') e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (!G) return;
  if (G.state === 'play' && (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW')) { Input.keys.add(e.code); e.preventDefault(); SFX.init(); }
  if (e.code === 'Escape' || e.code === 'KeyP') { if (G.state === 'play') pauseGame(); else if (G.state === 'pause') resumeGame(); }
});
window.addEventListener('keyup', e => Input.keys.delete(e.code));
window.addEventListener('blur', () => { Input.ptrs.clear(); Input.keys.clear(); });

// ---------- state ----------
let G = null;
function newGame(mode, demo = false) {
  const daily = mode === 'daily';
  const seed = daily ? hashStr('mukseon-' + todayKey()) : (Math.random() * 1e9) | 0;
  G = {
    state: demo ? 'menu' : 'play', demo, daily, seed, t: 0, player: newPlayer(), anchors: [], items: [], hazards: [],
    inkY: 420, inkSlow: 0, maxH: 0, score: 0, blossoms: 0, combo: 0, maxCombo: 0, grabs: 0, step: -1, target: null,
    biome: BIOMES[0], flashT: 0, newSeals: [], fragileSafe: 0, windX: 0, nextMile: 100, deadAt: 0, endShown: false, cause: '',
  };
  BGC.seed = seed; BGC.clear();
  Gen.reset(seed);
  G.anchors.push(makeAnchor('knot', W / 2, -70, mulberry32(seed + 1)));
  Gen.ensure(-1200);
  FX.init();
  V.camY = G.player.y - V.viewH * 0.6;
  Input.ptrs.clear(); Input.keys.clear(); Input.bot = false; // the menu autopilot must not leak into a real run
}

function update(dt) {
  G.t += dt;
  const p = G.player;
  const m = Math.max(0, -p.y / M);
  if (m > G.maxH) G.maxH = m;
  const pal = paletteAt(G.maxH);
  // biome change
  if (pal.b !== G.biome) {
    G.biome = pal.b;
    if (!G.demo) { showBanner(pal.b.en, pal.b.name, pal.b.poem, pal.b.night, 2.8); SFX.milestone(); }
  }
  if (!G.demo && G.maxH >= G.nextMile) {
    if (G.nextMile % 500 === 0) { FX.word(p.x, p.y - 40, fmt(G.nextMile) + ' m', true, true); SFX.milestone(); }
    G.nextMile += 100;
  }
  G.windX = pal.storm > 0.5 ? Math.sin(G.t * 0.35) * 140 + Math.sin(G.t * 1.3) * 40 : 0;
  if (G.state === 'play') Seals.check();
  Gen.ensure(V.camY - 900);
  updateAnchors(dt);
  if (G.state === 'play' || G.state === 'menu') updatePlayer(p, dt);
  else stepPlayer(p, dt);
  updateHazards(dt);
  // the ink rises: slow at first, faster with height, and it catches up if you dawdle far ahead
  if (!G.demo && G.state === 'play') {
    const started = G.grabs > 0 || G.t > 3;
    let v = started ? Math.min(170, 40 + G.maxH * 0.04) : 0;
    const gap = G.inkY - p.y;
    if (gap > 650) v += (gap - 650) * 0.8;
    if (G.inkSlow > 0) { G.inkSlow -= dt; v *= 0.35; }
    G.inkY -= v * dt;
  } else if (G.demo) { G.inkY = Math.max(G.inkY - 20 * dt, p.y + 520); }
  // prune what has sunk
  const cut = G.inkY + 400;
  if (G.anchors.length > 80) G.anchors = G.anchors.filter(a => a.y < cut || (p.rope && p.rope.a === a));
  if (G.items.length > 120) G.items = G.items.filter(i => !i.got && i.y < cut);
  if (G.hazards.length > 40) G.hazards = G.hazards.filter(h => !h.dead);
  // camera
  const target = p.y - V.viewH * 0.6;
  V.camY += (target - V.camY) * Math.min(1, dt * (target < V.camY ? 5 : 3));
  V.camY = Math.min(V.camY, G.inkY - V.viewH * 0.25);
  G.flashT = Math.max(0, G.flashT - dt);
  FX.updateWeather(dt, pal);
  SFX.setWind(Math.hypot((p.x - p.px) / STEP, (p.y - p.py) / STEP), G.state === 'play', pal.storm > 0.5);
  // random lightning flashes in the storm (harmless, for atmosphere)
  if (pal.storm > 0.5 && Math.random() < dt * 0.15) { G.flashT = 0.18; SFX.thunder(); }
}

function die(cause) {
  if (G.state !== 'play') return;
  const p = G.player;
  G.state = 'dead'; G.cause = cause; G.deadAt = performance.now();
  if (p.rope) p.rope = null;
  Input.ptrs.clear(); Input.keys.clear();
  FX.shake(cause === 'ink' ? 6 : 12);
  if (cause === 'ink') { FX.inkBurst(p.x, G.inkY, 30, 2); SFX.splash(); }
  else { SFX.hit(); FX.inkBurst(p.x, p.y, 18, 1.4, true); p.px = p.x - (p.x - p.px) * 0.3; p.py = p.y + 400 * STEP; }
  if (G.daily && cause !== 'quit') Seals.unlock('daily');
  Seals.check();
  const key = G.daily ? 'daily-' + todayKey() : 'best';
  const best = store.get(key, 0);
  G.isNew = G.maxH > best + 0.5;
  if (G.isNew) store.set(key, Math.floor(G.maxH));
  G.best = Math.max(best, Math.floor(G.maxH));
  if (!G.daily) { const total = store.get('blossoms', 0); store.set('blossoms', total + G.blossoms); }
}

// ---------- render ----------
let vignette = null;
function buildVignette() {
  vignette = document.createElement('canvas');
  const w = vignette.width = 200, h = vignette.height = 200, c = vignette.getContext('2d');
  const g = c.createRadialGradient(w / 2, h / 2, w * 0.3, w / 2, h / 2, w * 0.75);
  g.addColorStop(0, 'rgba(60,45,30,0)'); g.addColorStop(1, 'rgba(60,45,30,0.35)');
  c.fillStyle = g; c.fillRect(0, 0, w, h);
}
buildVignette();

function render() {
  const c = ctx, pal = paletteAt(G.maxH);
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  c.fillStyle = '#2a2622'; c.fillRect(0, 0, cv.width, cv.height);
  drawBackground(c, pal);
  // clip the world to the scroll strip
  c.save();
  c.setTransform(V.dpr, 0, 0, V.dpr, 0, 0);
  c.beginPath(); c.rect(V.ox, 0, W * V.scale, V.h); c.clip();
  worldXf(c);
  drawItems(c, pal);
  drawHazards(c, pal);
  drawAnchors(c, pal);
  drawRope(c, G.player, pal);
  if (G.state !== 'dead' || G.player.y < G.inkY + 20) drawPlayer(c, G.player, pal);
  FX.draw(c, pal);
  drawInk(c, pal);
  drawHint(c, pal);
  drawPaperOverlay(c, pal);
  worldXf(c);
  FX.drawWords(c, pal);
  c.restore();
  FX.drawWeather(c, pal);
  c.setTransform(V.dpr, 0, 0, V.dpr, 0, 0);
  if (G.flashT > 0) { c.fillStyle = `rgba(255,252,240,${G.flashT * 2.5})`; c.fillRect(V.ox, 0, W * V.scale, V.h); }
  c.globalAlpha = 1;
  c.drawImage(vignette, V.ox, 0, W * V.scale, V.h);
  // ink proximity: the bottom edge darkens as the ink closes in
  const gap = (G.inkY - G.player.y);
  if (G.state === 'play' && gap < 260) {
    const a = clamp(1 - gap / 260, 0, 1) * 0.55, g = c.createLinearGradient(0, V.h * 0.6, 0, V.h);
    g.addColorStop(0, 'rgba(11,10,9,0)'); g.addColorStop(1, `rgba(11,10,9,${a})`);
    c.fillStyle = g; c.fillRect(V.ox, V.h * 0.6, W * V.scale, V.h * 0.4);
  }
  drawMounting(c);
  drawUnroll(c);
}

function drawHint(c, pal) {
  if (G.demo || G.grabs > 0 || G.state !== 'play') return;
  const a = G.anchors[0], p = G.player;
  const k = 0.6 + 0.4 * Math.sin(G.t * 5);
  c.globalAlpha = k;
  c.fillStyle = '#b3261e'; c.font = '26px "Nanum Brush Script", serif'; c.textAlign = 'center'; c.textBaseline = 'middle';
  c.fillText('꾹 누르고 있으세요', W / 2, p.y + 60);
  c.font = '15px "Gowun Batang", serif'; c.fillStyle = rgba(pal.ink, 0.8);
  c.fillText('붉은 원의 매듭에 먹줄이 걸립니다', W / 2, p.y + 86);
  c.globalAlpha = 1;
  void a;
}

// ---------- HUD & screens ----------
const $ = id => document.getElementById(id);
const hud = {};
function setText(id, v) { if (hud[id] !== v) { hud[id] = v; $(id).textContent = v; } }
function updateHud() {
  const pal = paletteAt(G.maxH);
  setText('hH', fmt(Math.floor(G.maxH)));
  setText('hSub', `${pal.b.name} · 매화 ${G.blossoms}${G.daily ? ' · 오늘의 족자' : ''}`);
  const night = pal.night > 0.5;
  if (hud.night !== night) { hud.night = night; $('hud').classList.toggle('night', night); }
  const cmb = G.combo > 1 ? `연속 ${G.combo}` : '';
  if (hud.combo !== cmb) { hud.combo = cmb; $('hCombo').textContent = cmb; $('hCombo').classList.toggle('on', !!cmb); }
}
function updatePows() {
  const p = G.player, el = $('hPows'); let h = '';
  h += `<span class="lives" aria-label="남은 낙관 ${p.lives}">${'<i class="on"></i>'.repeat(Math.max(0, p.lives))}${'<i></i>'.repeat(Math.max(0, 3 - p.lives))}</span>`;
  if (p.shield) h += `<span class="pow"><i>符</i><b>${p.shield}</b></span>`;
  if (p.feather) h += `<span class="pow"><i style="background:#1b1a17">羽</i><b>${p.feather}</b></span>`;
  el.innerHTML = h;
}
let bannerT = 0;
function showBanner(a, b, c2, night, dur) {
  $('bn1').textContent = a; $('bn2').textContent = b; $('bn3').textContent = c2;
  const el = $('banner'); el.classList.toggle('night', !!night); el.classList.add('show');
  clearTimeout(bannerT); bannerT = setTimeout(() => el.classList.remove('show'), dur * 1000);
}
function showScreen(id) { for (const s of ['scrMenu', 'scrPause', 'scrEnd', 'scrSeals']) $(s).hidden = s !== id; }

function startRun(mode) {
  SFX.init();
  newGame(mode);
  $('hud').hidden = false; showScreen(null);
  for (const k in hud) delete hud[k];
  updatePows();
  showBanner(G.daily ? '오늘의 족자 · ' + todayKey() : BIOMES[0].en, BIOMES[0].name, BIOMES[0].poem, false, 2.4);
  last = performance.now();
}
function toMenu() {
  newGame('normal', true);
  $('hud').hidden = true; showScreen('scrMenu');
  const best = store.get('best', 0), daily = store.get('daily-' + todayKey(), 0);
  $('bestLine').textContent = [best ? `최고 ${fmt(best)} m` : '', daily ? `오늘의 족자 ${fmt(daily)} m` : ''].filter(Boolean).join(' · ');
}
function pauseGame() { if (G.state !== 'play') return; G.state = 'pause'; Input.ptrs.clear(); Input.keys.clear(); showScreen('scrPause'); }
function resumeGame() { if (G.state !== 'pause') return; SFX.init(); G.state = 'play'; showScreen(null); last = performance.now(); }
const CAUSE = {
  ink: '차오르는 먹물에 잠겼습니다.', crow: '까마귀와 부딪혀 떨어졌습니다.', spirit: '먹귀신에 닿아 손을 놓쳤습니다.',
  bolt: '번개가 먹줄을 끊었습니다.', rock: '굴러떨어진 바위에 맞았습니다.', quit: '붓을 내려놓았습니다.',
};
function showEnd() {
  $('endK').textContent = G.cause === 'ink' ? '먹물에 잠기다' : '떨어지다';
  $('endH').textContent = fmt(Math.floor(G.maxH)) + ' m';
  $('endNew').hidden = !G.isNew;
  $('endLede').textContent = `${biomeAt(G.maxH).name}에서 ${CAUSE[G.cause] || ''}`;
  const rows = [['도달 높이', fmt(Math.floor(G.maxH)) + ' m'], ['모은 매화', G.blossoms], ['최대 연속', G.maxCombo], ['먹줄을 건 횟수', G.grabs]];
  $('endStats').innerHTML = rows.map(([k, v]) => `<div><span>${k}</span><b>${v}</b></div>`).join('');
  $('endBest').textContent = (G.daily ? `오늘의 족자 최고 ${fmt(G.best)} m` : `최고 기록 ${fmt(G.best)} m`) + (G.newSeals.length ? ` · 새 낙관 ${G.newSeals.join(', ')}` : '');
  showScreen('scrEnd'); $('hud').hidden = true;
}

$('btnStart').addEventListener('click', () => startRun('normal'));
$('btnDaily').addEventListener('click', () => startRun('daily'));
$('btnSeals').addEventListener('click', openSeals);
$('btnSealsBack').addEventListener('click', () => showScreen('scrMenu'));
$('btnRetry').addEventListener('click', () => startRun(G && G.daily ? 'daily' : 'normal'));
$('btnMenu').addEventListener('click', toMenu);
$('btnPause').addEventListener('click', pauseGame);
$('btnResume').addEventListener('click', resumeGame);
$('btnQuit').addEventListener('click', () => { if (G.state === 'pause') { G.state = 'play'; showScreen(null); die('quit'); } });
function setToggle(id, on) { const b = $(id); b.classList.toggle('on', on); b.textContent = on ? '켜짐' : '꺼짐'; }
$('tgSound').addEventListener('click', () => { SFX.on = !SFX.on; store.set('sound', SFX.on); setToggle('tgSound', SFX.on); });
$('tgShake').addEventListener('click', () => { FX.shakeOn = !FX.shakeOn; store.set('shake', FX.shakeOn); setToggle('tgShake', FX.shakeOn); });
SFX.on = store.get('sound', true); setToggle('tgSound', SFX.on); setToggle('tgShake', FX.shakeOn);
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

// attract mode on the menu: a simple autopilot climbs behind the title
function demoPilot() {
  const p = G.player;
  if (p.rope) { const v = vel(p); Input.bot = !(v.y < -650 || p.rope.L <= LMIN + 2 || p.y < p.rope.a.y - 10); }
  else { const v = vel(p); Input.bot = v.y > -120 && !!findTarget(p); }
}

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 0; dt = Math.min(dt, 0.05);
  try {
    if (G.state === 'menu') { demoPilot(); update(dt); if (G.player.y > G.inkY - 30) newGame('normal', true); }
    else if (G.state === 'play') update(dt);
    else if (G.state === 'dead') { update(dt); if (performance.now() - G.deadAt > 1500 && !G.endShown) { G.endShown = true; showEnd(); } }
    if (G.state !== 'menu') Input.bot = false;
    FX.update(dt);
    render();
    if (G.state === 'play') updateHud();
  } catch (err) { console.error(err); }
}

function boot() { resize(); toMenu(); requestAnimationFrame(t => { last = t; frame(t); }); }
if (window.claude?.hot?.ready) window.claude.hot.ready(boot); else boot();

</script>
</body>
</html>
